name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv run --frozen ruff check .
      - name: install.sh (shellcheck)
        run: |
          command -v shellcheck || { sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck; }
          shellcheck install.sh

  test:
    name: pytest (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # те же версии, что в classifiers pyproject.toml (requires-python >= 3.10)
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - name: ripgrep
        run: |
          command -v rg || { sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep; }
          rg --version
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      # WSL-тесты (метка wsl) здесь пропускаются с причиной в отчёте -rs
      - run: uv run --frozen pytest -rs

  build:
    name: сборка пакета
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv build
      - name: колесо содержит панель и запускается
        run: |
          python3 -m zipfile -l dist/*.whl | grep -q 'wshub/panel.html'
          uv tool run --from dist/*.whl wshub --version
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7
